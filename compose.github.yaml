# Explicit opt-in: combine with compose.shipping.yaml after configuring the GitHub App.
services:
  backend:
    environment:
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
    volumes:
      - type: bind
        source: ${GITHUB_PRIVATE_KEY_FILE:?Set the host path of the GitHub App PEM file}
        target: /run/secrets/github-app.pem
        read_only: true
        bind:
          create_host_path: false
