name: tracepilot-shipping

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracepilot}
      POSTGRES_USER: ${POSTGRES_USER:-tracepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Initialize .env.shipping first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]

  rabbitmq:
    image: rabbitmq:4.4.0-management
    hostname: tracepilot-shipping-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tracepilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Initialize .env.shipping first}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [data]

  backend:
    build:
      context: ./backend
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-worktree}
    env_file: .env.shipping
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      GITHUB_PRIVATE_KEY_PATH: ""
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    stop_grace_period: 40s
    networks: [web, data]

  frontend:
    build:
      context: ./frontend
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-worktree}
    environment:
      BACKEND_URL: http://backend:8080
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:13000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-13000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    networks: [web]

networks:
  web:
  data:

volumes:
  postgres_data:
  rabbitmq_data:
