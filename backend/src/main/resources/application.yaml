spring:
  application:
    name: tracepilot
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:15432}/${POSTGRES_DB:tracepilot}
    username: ${POSTGRES_USER:tracepilot}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:tracepilot}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  mvc:
    problemdetails:
      enabled: true

tracepilot:
  auth:
    signing-secret: ${AUTH_SIGNING_SECRET}
  github:
    enabled: ${GITHUB_ENABLED:false}
    app-id: ${GITHUB_APP_ID:0}
    installation-id: ${GITHUB_INSTALLATION_ID:0}
    workspace-id: ${GITHUB_WORKSPACE_ID:}
    private-key-path: ${GITHUB_PRIVATE_KEY_PATH:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    api-base-url: https://api.github.com
  pipeline:
    enabled: ${PIPELINE_ENABLED:${GITHUB_ENABLED:false}}
    publish-batch-size: 10
    max-attempts: 3
    retry-delay: 2s
    processing-lease: 5m
    dispatch-delay-ms: 1000
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    base-url: https://api.openai.com/v1
    timeout: 30s
    max-input-characters: 16000
    max-output-tokens: 2048
    max-calls-per-day: 50
    input-price-per-million: ${AI_INPUT_PRICE_PER_MILLION:}
    output-price-per-million: ${AI_OUTPUT_PRICE_PER_MILLION:}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
